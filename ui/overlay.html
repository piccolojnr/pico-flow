<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    html, body { width: 320px; height: 64px; min-width: 320px; min-height: 64px; margin: 0; overflow: hidden; background: transparent; }
    body { display: grid; place-items: center; font: 14px system-ui, sans-serif; color: #fff; }
    .pill { display: flex; align-items: center; gap: 11px; width: 264px; height: 48px; padding: 0 18px; border: 1px solid #8877ff; border-radius: 28px; background: rgba(29, 27, 46, .96); box-shadow: 0 8px 30px rgba(0, 0, 0, .35); }
    .dot { width: 9px; height: 9px; border-radius: 50%; background: #ff5d7d; box-shadow: 0 0 12px #ff5d7d; }
    .label { font-weight: 600; }
    .hint { margin-left: auto; color: #c4bfd9; font-size: 12px; }
  </style>
</head>
<body>
  <div class="pill"><span class="dot"></span><span class="label">Listening</span><span class="hint">Release to stop</span></div>
</body>
</html>
